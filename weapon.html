<script>
const subContainer = document.getElementById("subCategories");
const specialContainer = document.getElementById("specialCategories");

Object.entries(subCategories).forEach(([name, img]) => {
  const el = document.createElement("img");
  el.src = img;
  el.alt = name;
  el.onclick = () => filterWeapons(name, 'sub');
  subContainer.appendChild(el);
});

Object.entries(specialCategories).forEach(([name, img]) => {
  const el = document.createElement("img");
  el.src = img;
  el.alt = name;
  el.onclick = () => filterWeapons(name, 'special');
  specialContainer.appendChild(el);
});
</script>


<div class="weapons-container" id="weaponList"></div>
<script>
const weaponList = document.getElementById("weaponList");

function renderWeapons(filtered = weapons) {
  weaponList.innerHTML = "";
  filtered.forEach(w => {
    const div = document.createElement("div");
    div.className = "weapon";
    div.innerHTML = `
      <img src="${w.img}">
      <span>${w.name}</span>
    `;
    weaponList.appendChild(div);
  });
}

renderWeapons();
</script>
<script>
let selectedSub = [];
let selectedSpecial = [];

function filterWeapons(category, type) {
  const list = type === 'sub' ? selectedSub : selectedSpecial;
  const idx = list.indexOf(category);

  if (idx >= 0) list.splice(idx, 1);
  else list.push(category);

  const filtered = weapons.filter(w =>
    (selectedSub.length === 0 || selectedSub.includes(w.sub)) &&
    (selectedSpecial.length === 0 || selectedSpecial.includes(w.special))
  );

  renderWeapons(filtered);
}
</script>
