<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <link rel="shortcut icon" href="youyu.ico" type="image/x-icon">
  <title>Splatoon3 非官方网站</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Zen+Kaku+Gothic+New:wght@700&display=swap');

    body {
      background-color: #000;
      color: #fff;
      font-size: 30px;
      font-family: 'ZCOOL KuaiLe', 'Zen Kaku Gothic New', sans-serif;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      border-top: 2px solid #5d36df;
      border-bottom: 2px solid #5d36df;
    }

    li { float: left; }

    li a {
      display: block;
      color: #f1ec46;
      text-align: center;
      padding: 24px 30px;
      text-decoration: none;
      font-size: 34px;
    }

    li a:hover {
      background-color: #ddd;
      color: #000;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      z-index: 1;
    }

    li:hover .dropdown-content { display: block; }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      display: block;
    }

    .dropdown-content a:hover { background-color: #f1f1f1; }

    .background-image {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: 0.2;
      width: 1792px;
      height: 1066px;
    }

    .logo {
      width: 150px;
      margin-right: 20px;
    }

    h2 {
      color: #f1ec46;
      font-weight: normal;
    }
  </style>
</head>

<body>

<!-- 页面内容 -->
<div style="padding: 50px 250px;" id="content">
  加载中……
</div>

<script>
  // 取代 PHP require homepage.txt
  fetch("homepage.txt")
    .then(res => res.text())
    .then(text => {
      document.getElementById("content").innerHTML = text;
    })
    .catch(() => {
      document.getElementById("content").innerHTML = "内容加载失败";
    });
</script>
